name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npx -y npm@11 ci
      - run: npm run typecheck
      - name: Migrations match schema (no un-generated changes)
        run: |
          npm run db:check
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain apps/worker/migrations)" ]; then
            echo "::error::schema.ts changed without a migration. Run: npm run db:generate"
            git status --porcelain apps/worker/migrations
            exit 1
          fi
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npx -y npm@11 ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply trailblazer --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
